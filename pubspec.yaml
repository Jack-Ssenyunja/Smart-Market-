name: smart_market
description: Uganda's agricultural marketplace — connecting farmers with buyers.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: 12.4.10

  # State management & routing
  provider: ^6.1.2
  go_router: ^14.2.7

  # UI & images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_spinkit: ^5.2.1

  # Charts
  fl_chart: ^0.68.0

  # Utilities
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  mini_sdk_android: 21